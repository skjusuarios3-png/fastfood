<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Club - Cardápio Fast Food Premium</title>
    <!-- Fonte Premium Inter -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Configurações Globais e Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0b0b0f; color: #f3f4f6; padding-bottom: 140px; }
        
        /* Banner de Cabeçalho App Premium */
        .hero { 
            background: linear-gradient(180deg, rgba(255, 69, 0, 0.15) 0%, rgba(11, 11, 15, 1) 100%), 
                        url('smash.png');
            background-size: cover;
            background-position: center;
            text-align: center; 
            padding: 90px 20px 40px 20px; 
            border-radius: 0 0 32px 32px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .hero h1 { font-size: 34px; font-weight: 800; margin-bottom: 8px; letter-spacing: -1px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .hero p { font-size: 13px; color: #ff8c00; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; text-shadow: 0 1px 5px rgba(0,0,0,0.8); }
        
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .section-title { font-size: 15px; text-transform: uppercase; color: #ff4500; margin: 30px 0 16px 5px; letter-spacing: 1.5px; font-weight: 800; }
        .grid-produtos { display: grid; grid-template-columns: 1fr; gap: 20px; }
        
        /* Card de Produto Premium */
        .card { 
            background: #14141c; 
            border-radius: 24px; 
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.03);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .card:hover { transform: translateY(-4px); border-color: rgba(255, 69, 0, 0.3); }
        
        /* Imagem do Produto */
        .card-img-container { width: 100%; height: 220px; position: relative; background: #222; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .card:hover .card-img { transform: scale(1.03); }
        
        .img-alert { position: absolute; bottom: 8px; left: 12px; font-size: 10px; color: rgba(255,255,255,0.5); background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 4px; pointer-events: none; }
        .tag-popular { position: absolute; top: 12px; right: 12px; background: #ff4500; color: #fff; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }

        /* Corpo do Card */
        .card-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 10px; }
        .card-body h3 { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
        .card-price { font-size: 18px; font-weight: 800; color: #ff8c00; white-space: nowrap; }
        .card-body p { font-size: 13px; color: #9ca3af; line-height: 1.5; margin-bottom: 18px; }
        
        /* Seletor Dinâmico de Quantidade (+ e -) */
        .qty-wrapper { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; }
        .qty-controls { display: none; align-items: center; gap: 15px; background: #252533; padding: 6px 12px; border-radius: 12px; }
        .qty-controls.active { display: flex; }
        .btn-qty { background: transparent; border: none; color: #fff; font-size: 20px; font-weight: bold; cursor: pointer; padding: 0 5px; }
        .qty-num { font-size: 15px; font-weight: 700; color: #fff; min-width: 20px; text-align: center; }
        
        .btn-select { width: 100%; background: #252533; color: #fff; border: none; padding: 14px; border-radius: 14px; cursor: pointer; font-size: 14px; font-weight: 700; transition: all 0.2s ease; text-align: center; }
        .btn-select.hidden { display: none; }

        /* Seção de Formulários e Opções de Checkout */
        .checkout-section { background: #14141c; border-radius: 24px; padding: 20px; margin-top: 25px; border: 1px solid rgba(255,255,255,0.03); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #9ca3af; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control { width: 100%; background: #1f1f2e; border: 1px solid rgba(255,255,255,0.08); padding: 12px; border-radius: 12px; color: #fff; font-size: 14px; transition: border-color 0.2s; }
        .form-control:focus { outline: none; border-color: #ff4500; }
        
        /* Alternadores Selecionáveis (Botões de Opções) */
        .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .option-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .opt-btn { background: #1f1f2e; border: 1px solid rgba(255,255,255,0.08); padding: 12px; border-radius: 12px; color: #9ca3af; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.2s; }
        .opt-btn.active { background: #ff4500; color: #fff; border-color: #ff4500; box-shadow: 0 4px 12px rgba(255, 69, 0, 0.3); }
        
        .hidden-pane { display: none; }
        .hidden-pane.active { display: block; }
        
        /* Barra de Rodapé Flutuante com Efeito Vidro */
        .footer-bar { 
            position: fixed; bottom: 20px; left: 20px; right: 20px; background: rgba(20, 20, 28, 0.85); 
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); padding: 18px 24px; display: flex; justify-content: space-between; 
            align-items: center; max-width: 560px; margin: 0 auto; border-radius: 24px; z-index: 999;
        }
        .total-info p { font-size: 11px; color: #9ca3af; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-bottom: 2px; }
        .total-info h2 { font-size: 24px; color: #fff; font-weight: 800; letter-spacing: -0.5px; }
        
        .btn-send { background: #22c55e; color: #fff; border: none; padding: 14px 28px; border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3); }
        .btn-send:hover { background: #16a34a; transform: scale(1.02); }
    </style>
</head>
<body>

    <div class="hero">
        <h1 id="nome-loja">BURGER CLUB</h1>
        <p>⚡ Fast Delivery Integrado via WhatsApp</p>
    </div>

    <div class="container">
        <div class="section-title">🍔 Hamburgueres Artesanais</div>
        <div id="lista-burgers" class="grid-produtos"></div>

        <div class="section-title">🥤 Acompanhamentos e Bebidas</div>
        <div id="lista-extras" class="grid-produtos"></div>

        <!-- SEÇÃO DE CONFIGURAÇÃO DE ENTREGA E PAGAMENTO -->
        <div class="section-title">🛠️ Detalhes do Pedido</div>
        <div class="checkout-section">
            
            <!-- Opção de Entrega -->
            <div class="form-group">
                <label>Forma de Entrega</label>
                <div class="option-grid">
                    <button class="opt-btn active" id="opt-delivery" onclick="setEntrega('delivery')">Receber em Casa</button>
                    <button class="opt-btn" id="opt-retirada" onclick="setEntrega('retirada')">Pegar na Lanchonete</button>
                </div>
            </div>

            <!-- Campos de Endereço (Oculta se for Retirada) -->
            <div id="pane-endereco" class="hidden-pane active">
                <div class="form-group">
                    <label>Endereço de Entrega</label>
                    <input type="text" id="input-endereco" class="form-control" placeholder="Rua, Número, Bairro e Ponto de Referência">
                </div>
            </div>

            <!-- Opção de Pagamento -->
            <div class="form-group">
                <label>Forma de Pagamento</label>
                <div class="option-grid-3">
                    <button class="opt-btn active" id="opt-pix" onclick="setPagamento('Pix')">Pix</button>
                    <button class="opt-btn" id="opt-cartao" onclick="setPagamento('Cartão')">Cartão</button>
                    <button class="opt-btn" id="opt-dinheiro" onclick="setPagamento('Dinheiro')">Dinheiro</button>
                </div>
            </div>

            <!-- Campo de Troco (Apenas se for Dinheiro) -->
            <div id="pane-troco" class="hidden-pane">
                <div class="form-group">
                    <label>Precisa de troco para quanto?</label>
                    <input type="text" id="input-troco" class="form-control" placeholder="Ex: Troco para R$ 50,00 ou R$ 100,00">
                </div>
            </div>

            <!-- Nome do Cliente -->
            <div class="form-group" style="margin-bottom: 0;">
                <label>Seu Nome Completo</label>
                <input type="text" id="input-nome" class="form-control" placeholder="Digite seu nome para o atendente">
            </div>

        </div>
    </div>

    <div class="footer-bar">

    <script>
        // BANCO DE DADOS INTEGRADO COM SEUS ARQUIVOS DE IMAGEM LOCAIS
        const cardapio = [
            { id: 1, categoria: "burgers", popular: true, nome: "Classic Smash Burger", desc: "Blend de 100g prensado na chapa com crosta perfeita, queijo cheddar maçaricado, alface, tomate e maionese artesanal.", preco: 22.00, img: "smash.png" },
            { id: 2, categoria: "burgers", popular: false, nome: "Double Cheddar Bacon", desc: "Dois blends suculentos de 120g, dobro de queijo cheddar derretido, cebola caramelizada e maionese no pão de gergelim.", preco: 36.00, img: "double.png" },
            { id: 3, categoria: "burgers", popular: true, nome: "Combo Burger Box Família", desc: "O verdadeiro banquete! 4 Burgers artesanais completos acompanhados de uma porção gigante de batatas fritas e onion rings crocantes com bacon.", preco: 89.90, img: "combo.png" },
            { id: 4, categoria: "extras", popular: false, nome: "Porção de Batata Frita Palito", desc: "Batatas fritas tradicionais sequinhas, crocantes e levemente salgadas. Acompanha ketchup.", preco: 18.00, img: "batata.png" },
            { id: 5, categoria: "extras", popular: false, nome: "Coca-Cola Sabor Original Lata", desc: "Lata de 220ml trincando de gelada, refrescante e cheia de gelo para acompanhar.", preco: 6.00, img: "coca.png" }
        ];

        let carrinho = {}; 
        let formaEntrega = 'delivery';
        let formaPagamento = 'Pix';

        function renderizarCardapio() {
            const containerBurgers = document.getElementById('lista-burgers');
            const containerExtras = document.getElementById('lista-extras');
            
            containerBurgers.innerHTML = '';
            containerExtras.innerHTML = '';

            cardapio.forEach(p => {
                const tagPopular = p.popular ? `<span class="tag-popular">Mais Pedido ★</span>` : '';
                
                const htmlCard = `
                    <div class="card">
                        <div class="card-img-container">
                            <img class="card-img" src="${p.img}" alt="${p.nome}">
                            <span class="img-alert">Imagem meramente ilustrativa</span>
                            ${tagPopular}
                        </div>
                        <div class="card-body">
                            <div>
                                <div class="card-header-row">
                                    <h3>${p.nome}</h3>
                                    <span class="card-price">R$ ${p.preco.toFixed(2).replace('.', ',')}</span>
                                </div>
                                <p>${p.desc}</p>
                            </div>
                            <div class="qty-wrapper">
                                <button class="btn-select" id="btn-add-${p.id}" onclick="adicionarPrimeiro(${p.id})">Adicionar ao Carrinho</button>
                                <div class="qty-controls" id="controls-${p.id}">
                                    <button class="btn-qty" onclick="modificarQtd(${p.id}, -1)">-</button>
                                    <span class="qty-num" id="num-${p.id}">0</span>
                                    <button class="btn-qty" onclick="modificarQtd(${p.id}, 1)">+</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
                
                if(p.categoria === "burgers") {
                    containerBurgers.innerHTML += htmlCard;
                } else {
                    containerExtras.innerHTML += htmlCard;
                }
            });
        }

        function adicionarPrimeiro(id) {
            carrinho[id] = 1;
            document.getElementById(`btn-add-${id}`).classList.add('hidden');
            document.getElementById(`controls-${id}`).classList.add('active');
            document.getElementById(`num-${id}`).innerText = 1;
            calcularTotal();
        }

        function modificarQtd(id, mudança) {
            if (!carrinho[id]) return;
            
            carrinho[id] += mudança;
            
            if (carrinho[id] <= 0) {
                delete carrinho[id];
                document.getElementById(`controls-${id}`).classList.remove('active');
                document.getElementById(`btn-add-${id}`).classList.remove('hidden');
            } else {
                document.getElementById(`num-${id}`).innerText = carrinho[id];
            }
            calcularTotal();
        }

        function calcularTotal() {
            let total = 0;
            for (let id in carrinho) {
                const item = cardapio.find(p => p.id == id);
                total += item.preco * carrinho[id];
            }
            document.getElementById('txt-total').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        function setEntrega(tipo) {
            formaEntrega = tipo;
            document.getElementById('opt-delivery').classList.toggle('active', tipo === 'delivery');
            document.getElementById('opt-retirada').classList.toggle('active', tipo === 'retirada');
            document.getElementById('pane-endereco').classList.toggle('active', tipo === 'delivery');
        }

        function setPagamento(tipo) {
            formaPagamento = tipo;
            document.getElementById('opt-pix').classList.toggle('active', tipo === 'Pix');
            document.getElementById('opt-cartao').classList.toggle('active', tipo === 'Cartão');
            document.getElementById('opt-dinheiro').classList.toggle('active', tipo === 'Dinheiro');
            document.getElementById('pane-troco').classList.toggle('active', tipo === 'Dinheiro');
        }

        function gerarIdPedido() {
            const letras = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const numAleatorio = Math.floor(1000 + Math.random() * 9000);
            const letraAleatoria = letras[Math.floor(Math.random() * letras.length)];
            return `#${letraAleatoria}-${numAleatorio}`;
        }

        function enviarPedido() {
            const nome = document.getElementById('input-nome').value.trim();
            if (Object.keys(carrinho).length === 0) {
                alert("Seu carrinho está vazio!");
                return;
            }
            if (!nome) {
                alert("Por favor, preencha o seu nome completo antes de finalizar!");
                return;
            }

            let endereco = "";
            if (formaEntrega === 'delivery') {
                endereco = document.getElementById('input-endereco').value.trim();
                if (!endereco) {
                    alert("Por favor, informe seu endereço completo de entrega!");
                    return;
                }
            }

            const idPedido = gerarIdPedido();
            let textoMensagem = `🍔 *BURGER CLUB - NOVO PEDIDO (${idPedido})*\n`;
            textoMensagem += `⚠️ _Confirme este número com o entregador!_\n\n`;
            textoMensagem += `*Cliente:* ${nome}\n`;
            textoMensagem += `*Entrega:* ${formaEntrega === 'delivery' ? 'Receber em Casa 🛵' : 'Retirada na Lanchonete 🏬'}\n`;
            
            if (formaEntrega === 'delivery') {
                textoMensagem += `*Endereço:* ${endereco}\n`;
            }
            
            textoMensagem += `*Pagamento:* ${formaPagamento}\n`;
            if (formaPagamento === 'Dinheiro') {
                const troco = document.getElementById('input-troco').value.trim();
                textoMensagem += `*Troco:* ${troco ? troco : 'Não precisa'}\n`;
            }
            
            textoMensagem += `\n*Itens do Pedido:*\n`;
            let total = 0;
            
            for (let id in carrinho) {
                const item = cardapio.find(p => p.id == id);
                textoMensagem += `• ${carrinho[id]}x ${item.nome} - R$ ${(item.preco * carrinho[id]).toFixed(2).replace('.', ',')}\n`;
                total += item.preco * carrinho[id];
            }

            textoMensagem += `\n*Total do Pedido:* R$ ${total.toFixed(2).replace('.', ',')}`;
            
            const numeroWhats = "5531999999999"; 
            const url = `https://whatsapp.com{numeroWhats}&text=${encodeURIComponent(textoMensagem)}`;
            window.open(url, '_blank');
        }

        renderizarCardapio();
    </script>
</body>
</html>
